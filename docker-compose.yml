services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: test_db
      MYSQL_ROOT_PASSWORD: dev123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-network
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: test_db
      DB_USERNAME: root
      DB_PASSWORD: dev123
    depends_on:
      - mysql
    ports:
      - "8082:8080"
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - devops-network

volumes:
  mysql-data:

networks:
  devops-network:
    driver: bridge
